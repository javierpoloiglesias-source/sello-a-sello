<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sello a Sello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plan: expediente administrativo convertido en tablero de juego.
   Cada nivel superado se gana con un sello de tinta; el radar cuenta ayudas en vivo. */
:root {
  --ink: #17223b;        /* tinta azul de documento oficial */
  --paper: #f1f3f7;      /* papel de oficio frío */
  --card: #ffffff;
  --sello: #c43a2f;      /* rojo de sello de registro */
  --oro: #e3a234;        /* monedas / ahorro */
  --verde: #1d7f55;      /* plazo abierto */
  --muted: #5a6478;
  --line: #d6dbe5;
  --soft: #e6eaf1;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ecf5; --paper: #0f1626; --card: #172137; --sello: #ec6a5c; --oro: #f0b64f; --verde: #4cc58e;
    --muted: #9aa5bd; --line: #2a3651; --soft: #1e2a44; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ecf5; --paper: #0f1626; --card: #172137; --sello: #ec6a5c; --oro: #f0b64f; --verde: #4cc58e;
  --muted: #9aa5bd; --line: #2a3651; --soft: #1e2a44; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  background-image: radial-gradient(var(--line) 0.8px, transparent 0.8px); background-size: 22px 22px; min-height: 100%; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

/* Barra superior */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; background: none; border: 0; cursor: pointer; padding: 0; }
.brand svg { flex: none; }
.radar { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sello); }
.pill.oro .dot { background: var(--oro); }
.pop { animation: pop .45s ease; }
@keyframes pop { 30% { transform: scale(1.18); } }

/* Mapa de sellos */
.mapa { display: flex; gap: 6px; align-items: center; padding: 14px 0 4px; overflow-x: auto; }
.sellito { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--display); font-size: 13px; color: var(--muted); background: var(--card); cursor: default; }
.sellito.hecho { border: 2px solid var(--sello); color: var(--sello); transform: rotate(-8deg); background: color-mix(in srgb, var(--sello) 10%, var(--card)); cursor: pointer; }
.sellito.actual { border: 2px solid var(--ink); color: var(--ink); }
.tramo { flex: 1 0 12px; height: 2px; background: var(--line); min-width: 12px; }
.tramo.hecho { background: var(--sello); }
.xp { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 6px 0 0; }
.xp i { display: block; height: 100%; background: linear-gradient(90deg, var(--sello), var(--oro)); width: 0; transition: width .4s ease; }

/* Inicio */
.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; padding: 40px 0 24px; }
.hero h1 { font-size: clamp(34px, 6vw, 62px); line-height: 1.02; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--sello); }
.hero p.lead { font-size: 19px; color: var(--muted); max-width: 52ch; }
.stampbig { aspect-ratio: 1; max-width: 360px; width: 100%; justify-self: center; }
.datos { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 0; }
.datos span { font-size: 14px; padding: 4px 10px; border-radius: 6px; background: var(--soft); }
.eligir { margin: 12px 0 40px; }
.eligir h2 { font-size: 20px; margin-bottom: 14px; }
.personajes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.pj { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform .15s, border-color .15s, box-shadow .15s; }
.pj:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: 0 8px 0 -2px var(--line); }
.pj b { font-family: var(--display); font-size: 17px; }
.pj small { color: var(--muted); font-size: 14px; line-height: 1.35; }
.pj svg { width: 52px; height: 52px; }

/* Pregunta */
.jugar { display: grid; grid-template-columns: 1fr 300px; gap: 24px; padding: 20px 0 48px; align-items: start; }
.tablero { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: 0 10px 0 -4px var(--line); min-height: 380px; display: flex; flex-direction: column; }
.eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--sello); font-weight: 700; }
.tablero h2 { font-size: clamp(22px, 3.4vw, 30px); margin: 8px 0 6px; line-height: 1.15; }
.ayuda { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }
.opciones { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.op { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; font-weight: 700; line-height: 1.3; }
.op small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; margin-top: 2px; }
.op .k { flex: none; font-family: var(--display); font-size: 11px; border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--muted); margin-top: 1px; }
.op:hover { border-color: var(--ink); }
.op[aria-pressed="true"] { border-color: var(--sello); background: color-mix(in srgb, var(--sello) 9%, var(--card)); }
.op[aria-pressed="true"] .k { background: var(--sello); border-color: var(--sello); color: #fff; }
.ccaa { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.ccaa .op { padding: 10px 12px; font-size: 15px; }
.num { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.num button { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); font-size: 24px; font-weight: 700; cursor: pointer; }
.num input { width: 120px; height: 48px; text-align: center; font-family: var(--display); font-size: 24px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); font-variant-numeric: tabular-nums; }
.steppers { display: grid; gap: 14px; }
.steppers .fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); flex-wrap: wrap; }
.steppers .num input { width: 72px; }
.slider { display: grid; gap: 10px; }
.slider output { font-family: var(--display); font-size: clamp(30px, 5vw, 44px); font-variant-numeric: tabular-nums; color: var(--ink); }
.slider .mes { color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--sello); height: 32px; }
.marcas { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.texto { width: 100%; max-width: 420px; height: 48px; border: 2px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--paper); }
.acciones { margin-top: auto; padding-top: 24px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 13px 22px; font-weight: 700; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn.pri { background: var(--ink); color: var(--paper); box-shadow: 0 4px 0 var(--sello); }
.btn.pri:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--sello); }
.btn.pri[disabled] { opacity: .4; cursor: not-allowed; }
.btn.sec { background: transparent; border: 2px solid var(--line); }
.btn.link { background: none; padding: 8px 4px; color: var(--muted); text-decoration: underline; }
.lado { position: sticky; top: 140px; display: grid; gap: 14px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.panel h3 { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; color: var(--muted); }
.bignum { font-family: var(--display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.bignum.oro { color: var(--oro); }
.mini { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; font-size: 14px; }
.mini li { display: flex; gap: 8px; align-items: baseline; }
.mini li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 2px; background: var(--sello); transform: rotate(45deg) translateY(-1px); }
.ficha { font-size: 14px; display: grid; gap: 4px; color: var(--muted); }
.ficha b { color: var(--ink); }

/* Sello conseguido */
.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 70%, transparent); z-index: 20; pointer-events: none; }
.overlay .golpe { text-align: center; animation: golpe .9s cubic-bezier(.2,1.6,.4,1) both; }
.overlay .golpe svg { width: 200px; height: 200px; }
.overlay .golpe p { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--sello); margin: 6px 0 0; }
@keyframes golpe { 0% { transform: scale(2.4) rotate(-20deg); opacity: 0; } 55% { transform: scale(.94) rotate(-9deg); opacity: 1; } 100% { transform: scale(1) rotate(-9deg); opacity: 1; } }

/* Resultados */
.res-hero { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; padding: 28px 0 8px; }
.res-hero h1 { font-size: clamp(28px, 4.5vw, 44px); line-height: 1.08; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.kpi .v { font-family: var(--display); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .l { font-size: 14px; color: var(--muted); }
.urgente { border: 2px solid var(--sello); background: color-mix(in srgb, var(--sello) 8%, var(--card)); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; }
.urgente b { color: var(--sello); }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; }
.filtros button { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: 15px; }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lista { display: grid; gap: 12px; }
.ay { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; border-left: 6px solid var(--line); }
.ay.e-abierta { border-left-color: var(--verde); }
.ay.e-siempre, .ay.e-renta { border-left-color: var(--ink); }
.ay.e-consultar { border-left-color: var(--oro); }
.ay.e-cerrada, .ay.e-proxima { border-left-color: var(--muted); }
.ay summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; }
.ay summary::-webkit-details-marker { display: none; }
.ay h3 { font-size: 17px; line-height: 1.25; }
.ay .org { color: var(--muted); font-size: 14px; }
.ay .imp { font-family: var(--display); font-weight: 800; font-size: 18px; text-align: right; color: var(--oro); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ay .imp small { display: block; font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--muted); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; }
.tag { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--soft); }
.tag.abierta { background: color-mix(in srgb, var(--verde) 16%, var(--card)); color: var(--verde); }
.tag.cerrada, .tag.proxima { background: var(--soft); color: var(--muted); }
.tag.consultar { background: color-mix(in srgb, var(--oro) 20%, var(--card)); }
.tag.alta { background: var(--ink); color: var(--paper); }
.ay .cuerpo { padding: 0 18px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; border-top: 1px dashed var(--line); padding-top: 16px; }
.ay .cuerpo h4 { font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; color: var(--sello); }
.ay .cuerpo ul, .ay .cuerpo ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.ay .cuerpo .full { grid-column: 1 / -1; }
.why { background: var(--soft); border-radius: 10px; padding: 10px 14px; }
.docs { list-style: none; padding: 0 !important; }
.docs label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.docs input { width: 20px; height: 20px; accent-color: var(--verde); flex: none; margin-top: 2px; }
.docs input:checked + span { text-decoration: line-through; color: var(--muted); }
.progreso { font-size: 13px; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; font-family: var(--body); }
.pie { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.mas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 28px 0; }
.mas a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; }
.mas a b { display: block; }
.mas a span { font-size: 14px; color: var(--muted); }
.plan textarea { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--paper); font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.aviso { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding: 18px 0 40px; margin-top: 24px; max-width: 80ch; }
.vacio { padding: 24px; text-align: center; color: var(--muted); }

/* Juego: partículas, puntos, avisos */
.star { position: fixed; z-index: 30; width: 18px; height: 18px; pointer-events: none; left: 0; top: 0;
  animation: estrella .75s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes estrella { 0% { transform: translate(var(--x0), var(--y0)) scale(.3) rotate(0); opacity: 1; }
  100% { transform: translate(calc(var(--x0) + var(--dx)), calc(var(--y0) + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; } }
.mas1 { position: fixed; z-index: 31; pointer-events: none; font-family: var(--display); font-weight: 800; color: var(--oro); font-size: 20px; animation: sube .9s ease-out forwards; text-shadow: 0 2px 0 var(--card); }
@keyframes sube { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -60px); opacity: 0; } }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 32; display: grid; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: entra .35s cubic-bezier(.2,1.4,.4,1), sale .4s ease 2.6s forwards; font-size: 15px; }
.toast b { font-family: var(--display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--oro); display: block; }
.toast svg { flex: none; width: 34px; height: 34px; }
@keyframes entra { from { transform: translateY(20px) scale(.9); opacity: 0; } }
@keyframes sale { to { transform: translateX(30px); opacity: 0; } }
.tablero.entra { animation: pantalla .38s cubic-bezier(.2,.9,.3,1); }
@keyframes pantalla { from { transform: translateX(40px); opacity: 0; } }
.racha { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--paper); background: var(--sello); border-radius: 6px; padding: 3px 8px; margin-left: 8px; vertical-align: middle; letter-spacing: .04em; }
.icono { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.icono svg { width: 20px; height: 20px; }

/* Pantalla de análisis y pantalla final (mundo nocturno, fijo en ambos temas) */
.escena { position: fixed; inset: 0; z-index: 15; background: #0b1222; color: #eef2fb; overflow: auto; color-scheme: dark;
  background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px), radial-gradient(circle at 50% 0%, #1d2a4d 0%, #0b1222 60%); background-size: 26px 26px, 100% 100%; }
.escena .in { max-width: 760px; margin: 0 auto; padding: 48px 20px 40px; min-height: 100%; display: flex; flex-direction: column; gap: 22px; justify-content: center; }
.escena h1 { font-size: clamp(30px, 6vw, 56px); line-height: 1.02; text-align: center; }
.escena .sub { text-align: center; color: #a9b5d3; margin: 0; }
.barra { height: 22px; border-radius: 99px; background: #1b2644; border: 2px solid #34436b; overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(-45deg, #e3a234 0 14px, #f0c060 14px 28px); transition: width .25s linear; }
.reloj { display: flex; justify-content: space-between; font-family: var(--display); font-size: 14px; color: #a9b5d3; font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; min-height: 260px; }
.log li { display: flex; gap: 12px; align-items: baseline; animation: entra .3s ease; font-size: 16px; }
.log li .ok { flex: none; font-family: var(--display); font-size: 12px; color: #0b1222; background: #4cc58e; border-radius: 6px; padding: 2px 7px; }
.log li .n { margin-left: auto; font-family: var(--display); color: #f0b64f; white-space: nowrap; }
.saltar { align-self: center; background: none; border: 1px solid #34436b; color: #a9b5d3; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
.final .titulo { font-family: var(--display); font-weight: 800; text-align: center; font-size: clamp(36px, 8vw, 76px); line-height: .95; letter-spacing: -.02em;
  background: linear-gradient(180deg, #fff 0%, #f0c060 100%); -webkit-background-clip: text; background-clip: text; color: transparent; animation: golpe2 .8s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes golpe2 { from { transform: scale(2); opacity: 0; } }
.estrellas { display: flex; justify-content: center; gap: 10px; }
.estrellas svg { width: 64px; height: 64px; opacity: .18; }
.estrellas svg.on { opacity: 1; animation: golpe2 .5s cubic-bezier(.2,1.6,.4,1) both; }
.marcador { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.marcador div { border: 1px solid #34436b; border-radius: 14px; padding: 12px; text-align: center; background: rgba(255,255,255,.03); }
.marcador b { display: block; font-family: var(--display); font-size: clamp(22px, 4vw, 34px); font-variant-numeric: tabular-nums; color: #f0b64f; }
.marcador span { font-size: 13px; color: #a9b5d3; }
.rango { text-align: center; font-family: var(--display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #ec6a5c; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.menu button { width: 100%; text-align: left; background: transparent; border: 2px solid transparent; color: #eef2fb; border-radius: 12px; padding: 12px 16px 12px 40px; font-family: var(--display); font-size: clamp(15px, 2.4vw, 18px); cursor: pointer; position: relative; display: flex; justify-content: space-between; gap: 12px; }
.menu button small { font-family: var(--body); font-size: 14px; color: #a9b5d3; font-weight: 400; }
.menu button::before { content: "▶"; position: absolute; left: 14px; color: #f0b64f; opacity: 0; transition: opacity .1s; }
.menu button:hover, .menu button:focus-visible, .menu button.sel { border-color: #f0b64f; background: rgba(240,182,79,.08); outline: none; }
.menu button:hover::before, .menu button:focus-visible::before, .menu button.sel::before { opacity: 1; animation: parpadea 1s steps(2) infinite; }
@keyframes parpadea { 50% { opacity: 0; } }
.pista { text-align: center; font-size: 13px; color: #7f8bab; margin: 0; }
.volver { margin: 18px 0 0; }
.doclista { display: grid; gap: 10px; }
.doclista label { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.doclista input { width: 22px; height: 22px; accent-color: var(--verde); flex: none; margin-top: 2px; }
.doclista small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.doclista input:checked + span > span { text-decoration: line-through; color: var(--muted); }

/* Robot guía */
.guia { display: flex; gap: 14px; align-items: flex-end; margin: 0 0 14px; }
.robot { flex: none; width: 92px; height: 112px; }
.robot .ojo-p { transition: transform .3s ease; }
.robot .parpado { transform-origin: center; transform-box: fill-box; animation: parpadeo 4.2s infinite; }
@keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
.robot .led { animation: led 2.4s ease-in-out infinite; }
@keyframes led { 50% { opacity: .35; } }
.robot .cuerpo-r { transform-origin: 50% 100%; animation: flota 3.2s ease-in-out infinite; }
@keyframes flota { 50% { transform: translateY(-3px); } }
.robot.habla .boca { animation: habla .18s steps(2) infinite; }
@keyframes habla { 50% { transform: scaleY(.3); } }
.robot .boca { transform-origin: center; transform-box: fill-box; }
.robot.feliz .ojo-f { display: block; } .robot .ojo-f { display: none; }
.robot.feliz .ojo-n { display: none; }
.robot.celebra .cuerpo-r { animation: salta .5s cubic-bezier(.3,1.6,.5,1) 3; }
@keyframes salta { 40% { transform: translateY(-14px) rotate(-4deg); } }
.robot.piensa .ojo-p { transform: translate(2px, -3px); }
.robot.piensa .led { animation-duration: .6s; }
.bocadillo { position: relative; background: var(--card); border: 2px solid var(--ink); border-radius: 16px 16px 16px 4px; padding: 12px 16px; font-size: 16px; line-height: 1.45; max-width: 640px; box-shadow: 0 4px 0 var(--line); min-height: 52px; }
.bocadillo b.nombre { display: block; font-family: var(--display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--sello); margin-bottom: 2px; }
.bocadillo::before { content: ""; position: absolute; left: -11px; bottom: 10px; border: 9px solid transparent; border-right-color: var(--ink); border-left: 0; }
.escena .bocadillo { background: #172137; border-color: #f0b64f; color: #eef2fb; box-shadow: none; }
.escena .bocadillo::before { border-right-color: #f0b64f; }
.escena .guia { justify-content: center; }
.hero .guia { margin-top: 20px; }

@media (max-width: 860px) {
  .hero, .jugar, .res-hero { grid-template-columns: 1fr; }
  .stampbig { max-width: 140px; order: -1; justify-self: start; }
  .hero { padding-top: 20px; gap: 12px; }
  .personajes { grid-template-columns: repeat(2, 1fr); }
  .lado { position: static; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .ay .cuerpo { grid-template-columns: 1fr; }
  .mas { grid-template-columns: 1fr; }
  .res-hero svg { width: 110px; height: 110px; }
}
@media (max-width: 420px) {
  .robot { width: 66px; height: 80px; }
  .bocadillo { font-size: 15px; }
  .personajes { grid-template-columns: 1fr; }
  .tablero { padding: 20px; }
  .radar .pill:nth-child(2) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .star, .mas1 { display: none; }
}

<script>
(function () {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const app = $("#app");
  const eur = n => (n || 0).toLocaleString("es-ES", { maximumFractionDigits: 0 }) + " €";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const yesno = [{ v: true, t: "Sí" }, { v: false, t: "No" }];
  const reduce = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── Sonido (sintetizado con Web Audio, sin archivos) ──
  const SND = (() => {
    let ctx = null, on = true;
    try { on = localStorage.getItem("sas-sonido") !== "off"; } catch (e) {}
    const ac = () => { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; };
    function nota(f, t0, dur, tipo = "sine", vol = .16, f2) {
      const c = ac(); if (!c || !on) return;
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
      o.type = tipo; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
    }
    return {
      get on() { return on; },
      toggle() { on = !on; try { localStorage.setItem("sas-sonido", on ? "on" : "off"); } catch (e) {} if (on) this.ok(); },
      ok(racha = 0) { const b = 660 * Math.pow(1.06, Math.min(racha, 8)); nota(b, 0, .09, "triangle", .14); nota(b * 1.5, .07, .16, "triangle", .12); nota(b * 3, .12, .22, "sine", .05); },
      pasar() { nota(320, 0, .18, "sine", .05, 900); },
      moneda() { nota(988, 0, .08, "square", .06); nota(1319, .08, .3, "square", .06); },
      nivel() { [523, 659, 784, 1047].forEach((f, i) => nota(f, i * .09, .22, "triangle", .14)); nota(1047, .38, .5, "sine", .08); },
      tic() { nota(1500, 0, .03, "square", .025); },
      victoria() { [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => nota(f, i * .11, i === 6 ? .9 : .16, "triangle", .15)); [523, 659, 784].forEach(f => nota(f, .77, 1, "sine", .06)); },
      menu() { nota(880, 0, .05, "square", .03); },
      voz() { [0, .07, .14].forEach((t, i) => nota(520 + i * 140 + Math.random() * 80, t, .06, "sine", .05)); }

      <rect x="44" y="104" width="32" height="22" rx="5" fill="#17223b"/><path d="M50 116l6 5 11-11" fill="none" stroke="#e3a234" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="led" d="M35 100q-3 10 0 22M85 100q3 10 0 22" fill="none" stroke="#38b6ff" stroke-width="3" stroke-linecap="round"/>

  }
  let timerHabla = null;

      i += 2; t.textContent = texto.slice(0, i);
      if (i >= texto.length) { clearInterval(timerHabla); r.classList.remove("habla"); }
    }, 22);
  }
  const ANIMOS = ["¡Genial, anotado!", "¡Perfecto! Seguimos.", "Muy bien, ya casi lo tienes.", "¡Eso me ayuda mucho!", "Apuntado en tu expediente."];

  // ── Efectos visuales ──
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="COL"/></svg>';
  function estrellas(el, n = 12) {
    if (reduce() || !el) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;

      document.body.appendChild(s); setTimeout(() => s.remove(), 800);
    }
  }
  function flotante(el, txt) {
    if (reduce() || !el) return;
    const r = el.getBoundingClientRect(), f = document.createElement("span");

    document.body.appendChild(f); setTimeout(() => f.remove(), 950);
  }
  function aviso(titulo, txt) {
    const t = document.createElement("div"); t.className = "toast";
    t.innerHTML = `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#e3a234"/><text x="20" y="27" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="18" fill="#17223b">€</text></svg><span><b>${esc(titulo)}</b>${esc(txt)}</span>`;

    while ($("#toasts").children.length > 3) $("#toasts").firstChild.remove();
  }
  const ICO_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICO_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  function pintaMute() { const b = $("#mute"); b.innerHTML = SND.on ? ICO_ON : ICO_OFF; b.setAttribute("aria-label", SND.on ? "Silenciar sonido" : "Activar sonido"); b.setAttribute("aria-pressed", String(!SND.on)); }

    asociacion: '<svg viewBox="0 0 52 52" aria-hidden="true"><path d="M26 44S7 33 7 19c0-6 5-10 10-10 4 0 7 2 9 5 2-3 5-5 9-5 5 0 10 4 10 10 0 14-19 25-19 25z" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/><path d="M18 24h16M26 16v16" stroke="var(--sello)" stroke-width="4" stroke-linecap="round"/></svg>',
    empresa: '<svg viewBox="0 0 52 52" aria-hidden="true"><path d="M26 6c8 6 11 15 9 26H17C15 21 18 12 26 6z" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/><circle cx="26" cy="20" r="4" fill="var(--sello)"/><path d="M17 32l-6 8h8M35 32l6 8h-8M22 38l4 8 4-8" fill="none" stroke="var(--oro)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'

  function selloSVG(txt, n) {

      <path d="M76 102l16 16 34-38" fill="none" stroke="var(--sello)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  // ── Opciones ──
  const CCAA_OPTS = Object.entries(KB.CCAA).map(([v, c]) => ({ v, t: c.n }));
  const ANIO = KB.IND.anio;

  // ── Niveles y preguntas ──

  const NIV = {

      { t: "Quién eres", q: [
        { g: "¡Hola! Soy Polito y te acompaño hasta el final. Empezamos por tu año de nacimiento: con la edad ya descarto o desbloqueo muchas ayudas.", id: "anioNac", tipo: "num", txt: "¿En qué año naciste?", ayuda: "La edad abre o cierra muchas ayudas: bono alquiler joven, IMV, Garantía Juvenil, pensiones…", min: 1920, max: ANIO - 14, def: 1990, suf: v => `Tienes unos ${ANIO - v} años` },
        { g: "Algunas ayudas piden llevar un tiempo en España. Elige la opción que mejor encaje, sin miedo: solo sirve para orientarte.", id: "residencia", tipo: "chips", txt: "¿Cuánto tiempo llevas viviendo legalmente en España?", ayuda: "Muchas prestaciones piden residencia mínima: 1 año para el IMV, 10 para la pensión no contributiva.", op: [{ v: "menos1", t: "Menos de 1 año" }, { v: "1a2", t: "1 a 2 años" }, { v: "2a5", t: "2 a 5 años" }, { v: "5a10", t: "5 a 10 años" }, { v: "mas10", t: "Más de 10 años o toda la vida" }] }
      ]},
      { t: "Dónde vives", q: [
        { g: "Ahora tu comunidad. Cada una tiene su renta mínima y sus convocatorias, así que es una pregunta clave.", id: "ccaa", tipo: "ccaa", txt: "¿En qué comunidad autónoma estás empadronado?", ayuda: "Las rentas mínimas, ayudas al alquiler, comedor o cuota cero dependen de tu comunidad.", op: CCAA_OPTS },
        { id: "municipio", tipo: "texto", txt: "¿Y tu municipio?", ayuda: "Opcional. Lo usamos para prepararte búsquedas de ayudas de tu ayuntamiento.", ph: "Ej.: Getafe", opcional: true },
        { id: "municipioPequeno", tipo: "chips", txt: "¿Tu municipio tiene menos de 5.000 habitantes?", ayuda: "Los pueblos pequeños tienen ayudas extra (recarga eléctrica, deducciones por despoblación).", op: [{ v: true, t: "Sí, es un pueblo pequeño" }, { v: false, t: "No" }, { v: false, t: "No lo sé", k: "nose" }] }
      ]},
      { t: "Tu hogar", q: [
        { g: "Cuéntame quién vive contigo. Cuantas más personas, más alto es el límite de ingresos de muchas ayudas.", id: "adultos", tipo: "num", txt: "¿Cuántos adultos vivís en casa (contándote)?", ayuda: "Los mayores de 18 años empadronados contigo.", min: 1, max: 10, def: 1 },
        { g: "Los peques cuentan mucho: hay ayudas solo para menores de 3 años. Usa los botones + y −.", id: "hijos", tipo: "steppers", txt: "¿Cuántos menores de 18 años viven contigo?", ayuda: "Por edades: algunas ayudas son solo para menores de 3 años.", filas: [{ id: "m0_3", t: "De 0 a 2 años" }, { id: "m3_6", t: "De 3 a 5 años" }, { id: "m6_18", t: "De 6 a 17 años" }] },

  const grupo = t => t === "empresa" ? "empresa" : t === "asociacion" ? "asociacion" : "hogar";

  // ── Estado ──
  const NUEVO = () => ({ vista: "inicio", p: {}, nivel: 0, idx: 0, sellos: 0, docs: {}, filtro: "todas", pts: 0, racha: 0, vistos: [] });
  let S = NUEVO();
  try { const g = localStorage.getItem("selloasello"); if (g) S = Object.assign(S, JSON.parse(g)); } catch (e) {}
  const H = window.claude && window.claude.hot;
  if (H && H.data && H.data.S) S = H.data.S;
  if (H && H.snapshot) H.snapshot(() => ({ S }));
  function guardar() { try { localStorage.setItem("selloasello", JSON.stringify(S)); } catch (e) {} }

  function derivar(p) {
    p.menores = (p.m0_3 || 0) + (p.m3_6 || 0) + (p.m6_18 || 0);
    if (p.anioNac) p.edad = ANIO - p.anioNac;
    if (p.tipo === "persona" && !p.adultos) p.adultos = 1;
    return p;
  }
  const niveles = () => NIV[grupo(S.p.tipo)] || [];
  const visibles = n => (niveles()[n] ? niveles()[n].q.filter(q => !q.show || q.show(derivar(S.p))) : []);
  const totalPreg = () => niveles().reduce((s, _, i) => s + visibles(i).length, 0);
  const hechas = () => niveles().reduce((s, _, i) => s + (i < S.nivel ? visibles(i).length : i === S.nivel ? S.idx : 0), 0);

  let ultimoN = -1, ultimoE = -1;
  function radar() {
    const p = derivar(Object.assign({}, S.p));
    const r = p.tipo ? KB.evaluar(p) : [];
    const n = r.filter(x => x.nivel !== "baja").length, e = KB.potencial(r);
    $("#nAyudas").textContent = n;
    $("#nEuros").textContent = eur(e);
    if (n !== ultimoN && ultimoN >= 0) { const el = $("#pAyudas"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    if (e !== ultimoE && ultimoE >= 0) { const el = $("#pEuros"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    ultimoN = n; ultimoE = e;
    if (S.vista === "jugar") {
      S.vistos = S.vistos || [];
      const nuevas = r.filter(x => x.nivel !== "baja" && !S.vistos.includes(x.a.id));
      if (nuevas.length && S.vistos.length + nuevas.length > 0 && radar.listo) {
        S.ultHallada = nuevas[0].nombre || nuevas[0].a.t;
        nuevas.slice(0, 2).forEach(x => aviso(nuevas.length > 1 ? `+${nuevas.length} ayudas desbloqueadas` : "Ayuda desbloqueada", x.nombre || x.a.t));
        SND.moneda();
      }
      nuevas.forEach(x => S.vistos.push(x.a.id));
    }
    radar.listo = true;
    $("#nPts").textContent = (S.pts || 0).toLocaleString("es-ES");
    return r;
  }

  // ── Vistas ──
  function render() {
    guardar();
    document.querySelectorAll(".escena").forEach(e => e.remove());
    if (S.vista === "inicio") vInicio();
    else if (S.vista === "jugar") vJugar();
    else if (S.vista === "analisis") vAnalisis();
    else if (S.vista === "final") vFinal();
    else if (S.vista === "docs") vDocs();
    else vResultados();
    radar();
  }

  function vInicio() {

        ${guiaHTML("guiaInicio", "¡Hola! Soy Polito, tu robot guía. Elige abajo tu personaje y te acompaño pregunta a pregunta hasta encontrar tus ayudas. Tardamos unos 3 minutos.", "feliz")}

  function mapaHTML() {
    const nv = niveles();
    let h = '<nav class="mapa" aria-label="Niveles">';
    nv.forEach((n, i) => {
      const cls = i < S.sellos ? "hecho" : i === S.nivel ? "actual" : "";
      if (i) h += `<span class="tramo ${i <= S.sellos ? "hecho" : ""}"></span>`;
      h += `<button type="button" class="sellito ${cls}" data-n="${i}" title="${esc(n.t)}" aria-label="Nivel ${i + 1}: ${esc(n.t)}" ${i < S.sellos ? "" : "disabled"}>${i < S.sellos ? "✓" : i + 1}</button>`;
    });
    h += `<span class="tramo ${S.sellos >= nv.length ? "hecho" : ""}"></span><span class="sellito ${S.sellos >= nv.length ? "hecho" : ""}" title="Expediente">★</span></nav>`;

    return h + `<div class="xp" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso"><i style="width:${pct}%"></i></div>`;

  function preguntaActual() {
    const vs = visibles(S.nivel);
    if (S.idx >= vs.length) return null;

  function vJugar() {
    const nv = niveles();
    if (S.nivel >= nv.length) { S.vista = S.terminado ? "final" : "analisis"; return render(); }
    const q = preguntaActual();

    } else if (q.tipo === "multi") {
      const arr = p[q.id] || [];
      cuerpo = `<div class="opciones" role="group">` + q.op.map((o, i) => `<button type="button" class="op" data-i="${i}" aria-pressed="${arr.includes(o.v)}"><span class="k">${i + 1}</span><span>${esc(o.t)}</span></button>`).join("") + "</div>";
    } else if (q.tipo === "num") {
      const v = val != null ? val : q.def;
      cuerpo = `<div class="num"><button type="button" data-d="-1" aria-label="Menos">−</button><input id="in-${q.id}" type="number" inputmode="numeric" min="${q.min}" max="${q.max}" value="${v}" aria-label="${esc(q.txt)}"><button type="button" data-d="1" aria-label="Más">+</button><span class="ayuda" id="suf" style="margin:0">${q.suf ? esc(q.suf(v)) : ""}</span></div>`;
    } else if (q.tipo === "slider") {
      const v = val != null ? val : q.def;
      cuerpo = `<div class="slider"><output id="out" for="in-${q.id}">${eur(v)}${q.mensual ? "/mes" : ""}</output>${q.mensual ? "" : `<span class="mes" id="mes">≈ ${eur(Math.round(v / 12))} al mes · ${eur(Math.round(v / Math.max(1, (p.adultos || 1) + p.menores)))} por persona</span>`}
        <input id="in-${q.id}" type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}" aria-label="${esc(q.txt)}">
        <div class="marcas"><span>${eur(q.min)}</span><span>${eur(q.max / 2)}</span><span>${eur(q.max)}${q.mensual ? "" : " o más"}</span></div></div>`;
    } else if (q.tipo === "steppers") {
      cuerpo = `<div class="steppers">` + q.filas.map(f => `<div class="fila"><span>${esc(f.t)}</span><div class="num"><button type="button" data-f="${f.id}" data-d="-1" aria-label="Menos ${esc(f.t)}">−</button><input id="in-${f.id}" type="number" min="0" max="12" value="${p[f.id] || 0}" aria-label="${esc(f.t)}"><button type="button" data-f="${f.id}" data-d="1" aria-label="Más ${esc(f.t)}">+</button></div></div>`).join("") + "</div>";
    } else if (q.tipo === "texto") {

    el.innerHTML = `<div class="in">
      <div class="titulo">MISIÓN<br>COMPLETADA</div>
      <div class="estrellas">${[0, 1, 2].map(i => `<svg viewBox="0 0 24 24" class="${i < estrellasN ? "on" : ""}" style="animation-delay:${.5 + i * .25}s" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="#f0b64f"/></svg>`).join("")}</div>
      <div class="rango">Rango: ${rango}</div>
      ${guiaHTML("guiaFin", enc.length ? `¡Lo conseguimos! He encontrado ${enc.length} ayudas para ti. Te recomiendo empezar por «Pedir ya» y después preparar los documentos. Elige una opción:` : "Con estos datos no veo ayudas claras, pero revisa «Buscar más» o cambia alguna respuesta.", "feliz celebra")}
      <div class="marcador">
        <div><b id="cAy">${intro ? 0 : enc.length}</b><span>ayudas con encaje</span></div>
        <div><b id="cEu">${intro ? "0 €" : eur(pot)}</b><span>estimado al año</span></div>
        <div><b id="cPt">${intro ? 0 : (S.pts || 0).toLocaleString("es-ES")}</b><span>puntos</span></div>
      </div>
      <ul class="menu" id="menu" role="menu">${opciones.map(([k, t, d], i) => `<li role="none"><button role="menuitem" type="button" data-k="${k}" class="${i === 0 ? "sel" : ""}"><span>${t}</span><small>${d}</small></button></li>`).join("")}</ul>
      <p class="pista">Usa ↑ ↓ y Enter, o pulsa una opción</p>
      <p class="sub" id="copiadoF" aria-live="polite" style="min-height:1.5em"></p>
    </div>`;
    document.body.appendChild(el);
    app.innerHTML = "";
    if (intro) {
      SND.victoria();
      const fin = { ay: enc.length, eu: pot, pt: S.pts || 0 }, t0 = performance.now(), D = 1400;
      const paso = () => {
        const k = Math.min(1, (performance.now() - t0) / D), e = 1 - Math.pow(1 - k, 3);
        $("#cAy").textContent = Math.round(fin.ay * e); $("#cEu").textContent = eur(Math.round(fin.eu * e)); $("#cPt").textContent = Math.round(fin.pt * e).toLocaleString("es-ES");
        if (k < 1) requestAnimationFrame(paso);
      };
      setTimeout(() => requestAnimationFrame(paso), 500);
      setTimeout(() => { for (let i = 0; i < 3; i++) setTimeout(() => estrellas(el.querySelector(".titulo"), 18), i * 250); }, 200);
    }
    S.saltarIntro = true; guardar();
    const btns = [...el.querySelectorAll(".menu button")];
    let sel = 0;
    const mover = i => { sel = (i + btns.length) % btns.length; btns.forEach((b, j) => b.classList.toggle("sel", j === sel)); btns[sel].focus(); SND.menu(); };
    btns.forEach((b, i) => { b.onmouseenter = () => { if (sel !== i) mover(i); }; b.onclick = () => elegir(b.dataset.k, b); });
    let tocado = false;
    el.onkeydown = e => {
      if (e.key === "ArrowDown") { tocado = true; mover(sel + 1); e.preventDefault(); }
      else if (e.key === "ArrowUp") { tocado = true; mover(sel - 1); e.preventDefault(); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); elegir(btns[sel].dataset.k, btns[sel]); }
    };
    if (!tocado) btns[0].focus({ preventScroll: true });
    function elegir(k, b) {
      SND.ok(2); estrellas(b, 8);
      if (["ya", "todas", "renta", "consultar", "preparar"].includes(k)) { S.filtro = k; S.vista = "resultados"; S.ir = null; }
      else if (k === "fuentes") { S.filtro = "todas"; S.vista = "resultados"; S.ir = "fuentes"; }
      else if (k === "docs") { S.vista = "docs"; }
      else if (k === "plan") {
        const txt = planTexto(p, res);
        navigator.clipboard.writeText(txt).then(() => { $("#copiadoF").textContent = "Plan de acción copiado. Pégalo donde quieras."; })
          .catch(() => { S.vista = "resultados"; S.ir = "planbox"; render(); });
        return;
      }
      else if (k === "editar") { S.vista = "jugar"; S.nivel = 0; S.idx = 0; }
      else if (k === "nueva") { S = NUEVO(); }
      render(); window.scrollTo(0, 0);
    }
  }

  // ── Checklist de documentos unificada ──
  function docsUnicos(res) {
    const m = new Map();
    res.filter(r => r.nivel !== "baja" && r.est.k !== "cerrada").forEach(r => r.a.docs.forEach(d => { if (!m.has(d)) m.set(d, []); m.get(d).push(r.nombre || r.a.t); }));
    return [...m.entries()].sort((a, b) => b[1].length - a[1].length);
  }
  function vDocs() {
    const res = KB.evaluar(derivar(Object.assign({}, S.p)));
    const L = docsUnicos(res);
    S.docsG = S.docsG || {};
    const listos = L.filter(([d]) => S.docsG[d]).length;
    app.innerHTML = `<p class="volver"><button class="btn sec" id="aMenu" type="button">← Menú final</button></p>
      <section style="padding:12px 0 40px;max-width:820px">
        ${guiaHTML("guiaDocs", listos === L.length && L.length ? "¡Lo tienes todo! Ya puedes presentar tus solicitudes." : "Empieza por arriba: esos documentos te sirven para muchas ayudas a la vez. Cada uno que consigas suma 50 puntos.", listos === L.length && L.length ? "feliz celebra" : "")}
        <div class="eyebrow">Misión documentos · ${listos}/${L.length} conseguidos</div>
        <h1 style="font-size:clamp(26px,4vw,40px);margin:6px 0 8px">Tu checklist de documentos</h1>
        <p class="ayuda">Ordenados por cuántas ayudas los piden: empieza por arriba y desbloquearás más solicitudes con menos trámites.</p>
        <div class="xp" style="margin:0 0 18px"><i style="width:${L.length ? (100 * listos / L.length) : 0}%"></i></div>
        <div class="doclista">${L.map(([d, ays], i) => `<label><input type="checkbox" data-i="${i}" ${S.docsG[d] ? "checked" : ""}><span><span>${esc(d)}</span><small>Lo piden ${ays.length} ayuda(s): ${esc(ays.slice(0, 4).join(", "))}${ays.length > 4 ? "…" : ""}</small></span></label>`).join("")}</div>
      </section>`;
    $("#aMenu").onclick = () => { S.vista = "final"; render(); };
    app.querySelectorAll(".doclista input").forEach(i => i.onchange = () => {
      S.docsG[L[+i.dataset.i][0]] = i.checked;
      if (i.checked) { SND.moneda(); estrellas(i, 8); S.pts = (S.pts || 0) + 50; }
      guardar(); const sc = window.scrollY; render(); window.scrollTo(0, sc);
    });
  }

  function busqueda(p) {
    if (p.tipo === "empresa") return "emprendedores autónomos";
    if (p.tipo === "asociacion") return "asociaciones entidades";
    return p.menores ? "familias" : "personas";
  }

  function tarjeta(r) {
    const a = r.a, e = r.est;
    const docs = a.docs.map((d, i) => { const k = a.id + ":" + i; return `<li><label><input type="checkbox" data-k="${k}" ${S.docs[k] ? "checked" : ""}><span>${esc(d)}</span></label></li>`; }).join("");
    const listos = a.docs.filter((_, i) => S.docs[a.id + ":" + i]).length;
    return `<details class="ay e-${e.k}">
      <summary>
        <div><h3>${esc(r.nombre || a.t)}</h3><div class="org">${esc(a.org)}</div></div>
        <div class="imp">${r.imp ? eur(r.imp) + "<small>estimado/año</small>" : ""}</div>
        <div class="tags"><span class="tag ${e.k}">${esc(e.txt)}</span><span class="tag ${r.nivel}">${NIVEL[r.nivel]}</span><span class="tag">${AMB[a.amb]}</span></div>
      </summary>
      <div class="cuerpo">
        <div class="full why"><b>Por qué te encaja:</b> ${r.why.map(esc).join(". ")}.</div>
        <div class="full"><p style="margin:0 0 6px">${esc(a.res)}</p>${r.detalle ? `<p style="margin:0 0 6px"><b>En tu comunidad:</b> ${esc(r.detalle)}</p>` : ""}<p style="margin:0"><b>Cuantía:</b> ${esc(a.cuantia)}</p></div>
        ${e.nota || e.prox ? `<div class="full" style="font-size:15px"><b>Plazo:</b> ${esc([e.nota, e.prox].filter(Boolean).join(". "))}</div>` : ""}
        <div><h4>Requisitos a comprobar</h4><ul>${a.req.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div><h4>Documentos <span class="progreso">${listos}/${a.docs.length} listos</span></h4><ul class="docs">${docs}</ul></div>
        <div class="full"><h4>Pasos para solicitarla</h4><ol>${a.pasos.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
        <div class="full pie"><span>Fuente: ${esc(a.fuente)} · revisado el ${KB.fmt(a.ver)}</span>${r.url ? `<a class="btn pri" href="${esc(r.url)}" target="_blank" rel="noopener">Ir a la web oficial ↗</a>` : ""}</div>
      </div>
    </details>`;
  }

  function planTexto(p, res) {
    const L = [];
    L.push(`SELLO A SELLO · Plan de acción (${new Date().toLocaleDateString("es-ES")})`);
    L.push(`Perfil: ${p.tipo}${p.edad ? ", " + p.edad + " años" : ""}${p.ccaa ? ", " + KB.CCAA[p.ccaa].n : ""}${p.municipio ? " (" + p.municipio + ")" : ""}${p.ingresos != null ? ", ingresos " + eur(p.ingresos) + "/año" : ""}`);
    L.push("");
    const grupos = [["PEDIR YA", r => r.est.k === "abierta" || r.est.k === "siempre"], ["EN LA DECLARACIÓN DE LA RENTA", r => r.est.k === "renta"], ["CONSULTAR CONVOCATORIA DE TU COMUNIDAD / ENTIDAD", r => r.est.k === "consultar"], ["PREPARAR PARA LA PRÓXIMA CONVOCATORIA", r => r.est.k === "cerrada" || r.est.k === "proxima"]];
    for (const [t, f] of grupos) {
      const g = res.filter(f); if (!g.length) continue;
      L.push(t);
      g.forEach(r => L.push(`- ${r.nombre || r.a.t} · ${r.est.txt}${r.imp ? " · ~" + eur(r.imp) + "/año" : ""}\n  ${r.url || ""}`));
      L.push("");
    }
    const docs = new Set(); res.filter(r => r.nivel !== "baja").forEach(r => r.a.docs.forEach(d => docs.add(d)));
    if (docs.size) { L.push("DOCUMENTOS QUE TE CONVIENE TENER LISTOS"); [...docs].forEach(d => L.push("[ ] " + d)); L.push(""); }
    L.push("Orientativo. Confirma requisitos y plazos en cada web oficial.");
    return L.join("\n");
  }

  // Teclado: números eligen opción, Enter avanza
  document.addEventListener("keydown", e => {
    if (S.vista !== "jugar" || e.target.tagName === "INPUT" || e.altKey || e.ctrlKey || e.metaKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) { const b = app.querySelectorAll(".op")[n - 1]; if (b) { b.click(); e.preventDefault(); } }
    else if (e.key === "Enter" && !e.target.closest("button")) { const s = $("#sig"); if (s && !s.disabled) s.click(); }
  });
  $("#home").onclick = () => { S.vista = "inicio"; render(); };
  $("#mute").onclick = () => { SND.toggle(); pintaMute(); };
  pintaMute();

  // Restaurar respuestas de chips al volver a una partida guardada
  if (!S.resp) S.resp = {};
  render();
})();
</script>
</body>
</html>
