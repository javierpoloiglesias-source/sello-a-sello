<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sello a Sello</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17223b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sello a Sello">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="description" content="Encuentra las ayudas, becas y subvenciones de España que te tocan, con documentos y pasos para pedirlas.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plan: expediente administrativo convertido en tablero de juego.
   Cada nivel superado se gana con un sello de tinta; el radar cuenta ayudas en vivo. */
:root {
  --ink: #17223b;        /* tinta azul de documento oficial */
  --paper: #f1f3f7;      /* papel de oficio frío */
  --card: #ffffff;
  --sello: #c43a2f;      /* rojo de sello de registro */
  --oro: #e3a234;        /* monedas / ahorro */
  --verde: #1d7f55;      /* plazo abierto */
  --muted: #5a6478;
  --line: #d6dbe5;
  --soft: #e6eaf1;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ecf5; --paper: #0f1626; --card: #172137; --sello: #ec6a5c; --oro: #f0b64f; --verde: #4cc58e;
    --muted: #9aa5bd; --line: #2a3651; --soft: #1e2a44; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ecf5; --paper: #0f1626; --card: #172137; --sello: #ec6a5c; --oro: #f0b64f; --verde: #4cc58e;
  --muted: #9aa5bd; --line: #2a3651; --soft: #1e2a44; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  background-image: radial-gradient(var(--line) 0.8px, transparent 0.8px); background-size: 22px 22px; min-height: 100%; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

/* Barra superior */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; background: none; border: 0; cursor: pointer; padding: 0; }
.brand svg { flex: none; }
.radar { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sello); }
.pill.oro .dot { background: var(--oro); }
.pop { animation: pop .45s ease; }
@keyframes pop { 30% { transform: scale(1.18); } }

/* Mapa de sellos */
.mapa { display: flex; gap: 6px; align-items: center; padding: 14px 0 4px; overflow-x: auto; }
.sellito { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--display); font-size: 13px; color: var(--muted); background: var(--card); cursor: default; }
.sellito.hecho { border: 2px solid var(--sello); color: var(--sello); transform: rotate(-8deg); background: color-mix(in srgb, var(--sello) 10%, var(--card)); cursor: pointer; }
.sellito.actual { border: 2px solid var(--ink); color: var(--ink); }
.tramo { flex: 1 0 12px; height: 2px; background: var(--line); min-width: 12px; }
.tramo.hecho { background: var(--sello); }
.xp { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 6px 0 0; }
.xp i { display: block; height: 100%; background: linear-gradient(90deg, var(--sello), var(--oro)); width: 0; transition: width .4s ease; }

/* Inicio */
.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; padding: 40px 0 24px; }
.hero h1 { font-size: clamp(34px, 6vw, 62px); line-height: 1.02; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--sello); }
.hero p.lead { font-size: 19px; color: var(--muted); max-width: 52ch; }
.stampbig { aspect-ratio: 1; max-width: 360px; width: 100%; justify-self: center; }
.datos { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 0; }
.datos span { font-size: 14px; padding: 4px 10px; border-radius: 6px; background: var(--soft); }
.eligir { margin: 12px 0 40px; }
.eligir h2 { font-size: 20px; margin-bottom: 14px; }
.personajes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.pj { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform .15s, border-color .15s, box-shadow .15s; }
.pj:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: 0 8px 0 -2px var(--line); }
.pj b { font-family: var(--display); font-size: 17px; }
.pj small { color: var(--muted); font-size: 14px; line-height: 1.35; }
.pj svg { width: 52px; height: 52px; }

/* Pregunta */
.jugar { display: grid; grid-template-columns: 1fr 300px; gap: 24px; padding: 20px 0 48px; align-items: start; }
.tablero { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: 0 10px 0 -4px var(--line); min-height: 380px; display: flex; flex-direction: column; }
.eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--sello); font-weight: 700; }
.tablero h2 { font-size: clamp(22px, 3.4vw, 30px); margin: 8px 0 6px; line-height: 1.15; }
.ayuda { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }
.opciones { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.op { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; font-weight: 700; line-height: 1.3; }
.op small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; margin-top: 2px; }
.op .k { flex: none; font-family: var(--display); font-size: 11px; border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--muted); margin-top: 1px; }
.op:hover { border-color: var(--ink); }
.op[aria-pressed="true"] { border-color: var(--sello); background: color-mix(in srgb, var(--sello) 9%, var(--card)); }
.op[aria-pressed="true"] .k { background: var(--sello); border-color: var(--sello); color: #fff; }
.ccaa { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.ccaa .op { padding: 10px 12px; font-size: 15px; }
.num { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.num button { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); font-size: 24px; font-weight: 700; cursor: pointer; }
.num input { width: 120px; height: 48px; text-align: center; font-family: var(--display); font-size: 24px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); font-variant-numeric: tabular-nums; }
.steppers { display: grid; gap: 14px; }
.steppers .fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); flex-wrap: wrap; }
.steppers .num input { width: 72px; }
.slider { display: grid; gap: 10px; }
.slider output { font-family: var(--display); font-size: clamp(30px, 5vw, 44px); font-variant-numeric: tabular-nums; color: var(--ink); }
.slider .mes { color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--sello); height: 32px; }
.marcas { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.texto { width: 100%; max-width: 420px; height: 48px; border: 2px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--paper); }
.acciones { margin-top: auto; padding-top: 24px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 13px 22px; font-weight: 700; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn.pri { background: var(--ink); color: var(--paper); box-shadow: 0 4px 0 var(--sello); }
.btn.pri:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--sello); }
.btn.pri[disabled] { opacity: .4; cursor: not-allowed; }
.btn.sec { background: transparent; border: 2px solid var(--line); }
.btn.link { background: none; padding: 8px 4px; color: var(--muted); text-decoration: underline; }
.lado { position: sticky; top: 140px; display: grid; gap: 14px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.panel h3 { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; color: var(--muted); }
.bignum { font-family: var(--display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.bignum.oro { color: var(--oro); }
.mini { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; font-size: 14px; }
.mini li { display: flex; gap: 8px; align-items: baseline; }
.mini li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 2px; background: var(--sello); transform: rotate(45deg) translateY(-1px); }
.ficha { font-size: 14px; display: grid; gap: 4px; color: var(--muted); }
.ficha b { color: var(--ink); }

/* Sello conseguido */
.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 70%, transparent); z-index: 20; pointer-events: none; }
.overlay .golpe { text-align: center; animation: golpe .9s cubic-bezier(.2,1.6,.4,1) both; }
.overlay .golpe svg { width: 200px; height: 200px; }
.overlay .golpe p { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--sello); margin: 6px 0 0; }
@keyframes golpe { 0% { transform: scale(2.4) rotate(-20deg); opacity: 0; } 55% { transform: scale(.94) rotate(-9deg); opacity: 1; } 100% { transform: scale(1) rotate(-9deg); opacity: 1; } }

/* Resultados */
.res-hero { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; padding: 28px 0 8px; }
.res-hero h1 { font-size: clamp(28px, 4.5vw, 44px); line-height: 1.08; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.kpi .v { font-family: var(--display); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .l { font-size: 14px; color: var(--muted); }
.urgente { border: 2px solid var(--sello); background: color-mix(in srgb, var(--sello) 8%, var(--card)); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; }
.urgente b { color: var(--sello); }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; }
.filtros button { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: 15px; }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lista { display: grid; gap: 12px; }
.ay { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; border-left: 6px solid var(--line); }
.ay.e-abierta { border-left-color: var(--verde); }
.ay.e-siempre, .ay.e-renta { border-left-color: var(--ink); }
.ay.e-consultar { border-left-color: var(--oro); }
.ay.e-cerrada, .ay.e-proxima { border-left-color: var(--muted); }
.ay summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; }
.ay summary::-webkit-details-marker { display: none; }
.ay h3 { font-size: 17px; line-height: 1.25; }
.ay .org { color: var(--muted); font-size: 14px; }
.ay .imp { font-family: var(--display); font-weight: 800; font-size: 18px; text-align: right; color: var(--oro); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ay .imp small { display: block; font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--muted); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; }
.tag { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--soft); }
.tag.abierta { background: color-mix(in srgb, var(--verde) 16%, var(--card)); color: var(--verde); }
.tag.cerrada, .tag.proxima { background: var(--soft); color: var(--muted); }
.tag.consultar { background: color-mix(in srgb, var(--oro) 20%, var(--card)); }
.tag.alta { background: var(--ink); color: var(--paper); }
.ay .cuerpo { padding: 0 18px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; border-top: 1px dashed var(--line); padding-top: 16px; }
.ay .cuerpo h4 { font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; color: var(--sello); }
.ay .cuerpo ul, .ay .cuerpo ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.ay .cuerpo .full { grid-column: 1 / -1; }
.why { background: var(--soft); border-radius: 10px; padding: 10px 14px; }
.docs { list-style: none; padding: 0 !important; }
.docs label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.docs input { width: 20px; height: 20px; accent-color: var(--verde); flex: none; margin-top: 2px; }
.docs input:checked + span { text-decoration: line-through; color: var(--muted); }
.progreso { font-size: 13px; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; font-family: var(--body); }
.pie { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.mas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 28px 0; }
.mas a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; }
.mas a b { display: block; }
.mas a span { font-size: 14px; color: var(--muted); }
.plan textarea { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--paper); font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.aviso { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding: 18px 0 40px; margin-top: 24px; max-width: 80ch; }
.vacio { padding: 24px; text-align: center; color: var(--muted); }

/* Juego: partículas, puntos, avisos */
.star { position: fixed; z-index: 30; width: 18px; height: 18px; pointer-events: none; left: 0; top: 0;
  animation: estrella .75s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes estrella { 0% { transform: translate(var(--x0), var(--y0)) scale(.3) rotate(0); opacity: 1; }
  100% { transform: translate(calc(var(--x0) + var(--dx)), calc(var(--y0) + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; } }
.mas1 { position: fixed; z-index: 31; pointer-events: none; font-family: var(--display); font-weight: 800; color: var(--oro); font-size: 20px; animation: sube .9s ease-out forwards; text-shadow: 0 2px 0 var(--card); }
@keyframes sube { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -60px); opacity: 0; } }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 32; display: grid; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: entra .35s cubic-bezier(.2,1.4,.4,1), sale .4s ease 2.6s forwards; font-size: 15px; }
.toast b { font-family: var(--display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--oro); display: block; }
.toast svg { flex: none; width: 34px; height: 34px; }
@keyframes entra { from { transform: translateY(20px) scale(.9); opacity: 0; } }
@keyframes sale { to { transform: translateX(30px); opacity: 0; } }
.tablero.entra { animation: pantalla .38s cubic-bezier(.2,.9,.3,1); }
@keyframes pantalla { from { transform: translateX(40px); opacity: 0; } }
.racha { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--paper); background: var(--sello); border-radius: 6px; padding: 3px 8px; margin-left: 8px; vertical-align: middle; letter-spacing: .04em; }
.icono { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.icono svg { width: 20px; height: 20px; }

/* Pantalla de análisis y pantalla final (mundo nocturno, fijo en ambos temas) */
.escena { position: fixed; inset: 0; z-index: 15; background: #0b1222; color: #eef2fb; overflow: auto; color-scheme: dark;
  background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px), radial-gradient(circle at 50% 0%, #1d2a4d 0%, #0b1222 60%); background-size: 26px 26px, 100% 100%; }
.escena .in { max-width: 760px; margin: 0 auto; padding: 48px 20px 40px; min-height: 100%; display: flex; flex-direction: column; gap: 22px; justify-content: center; }
.escena h1 { font-size: clamp(30px, 6vw, 56px); line-height: 1.02; text-align: center; }
.escena .sub { text-align: center; color: #a9b5d3; margin: 0; }
.barra { height: 22px; border-radius: 99px; background: #1b2644; border: 2px solid #34436b; overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(-45deg, #e3a234 0 14px, #f0c060 14px 28px); transition: width .25s linear; }
.reloj { display: flex; justify-content: space-between; font-family: var(--display); font-size: 14px; color: #a9b5d3; font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; min-height: 260px; }
.log li { display: flex; gap: 12px; align-items: baseline; animation: entra .3s ease; font-size: 16px; }
.log li .ok { flex: none; font-family: var(--display); font-size: 12px; color: #0b1222; background: #4cc58e; border-radius: 6px; padding: 2px 7px; }
.log li .n { margin-left: auto; font-family: var(--display); color: #f0b64f; white-space: nowrap; }
.saltar { align-self: center; background: none; border: 1px solid #34436b; color: #a9b5d3; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
.final .titulo { font-family: var(--display); font-weight: 800; text-align: center; font-size: clamp(36px, 8vw, 76px); line-height: .95; letter-spacing: -.02em;
  background: linear-gradient(180deg, #fff 0%, #f0c060 100%); -webkit-background-clip: text; background-clip: text; color: transparent; animation: golpe2 .8s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes golpe2 { from { transform: scale(2); opacity: 0; } }
.estrellas { display: flex; justify-content: center; gap: 10px; }
.estrellas svg { width: 64px; height: 64px; opacity: .18; }
.estrellas svg.on { opacity: 1; animation: golpe2 .5s cubic-bezier(.2,1.6,.4,1) both; }
.marcador { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.marcador div { border: 1px solid #34436b; border-radius: 14px; padding: 12px; text-align: center; background: rgba(255,255,255,.03); }
.marcador b { display: block; font-family: var(--display); font-size: clamp(22px, 4vw, 34px); font-variant-numeric: tabular-nums; color: #f0b64f; }
.marcador span { font-size: 13px; color: #a9b5d3; }
.rango { text-align: center; font-family: var(--display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #ec6a5c; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.menu button { width: 100%; text-align: left; background: transparent; border: 2px solid transparent; color: #eef2fb; border-radius: 12px; padding: 12px 16px 12px 40px; font-family: var(--display); font-size: clamp(15px, 2.4vw, 18px); cursor: pointer; position: relative; display: flex; justify-content: space-between; gap: 12px; }
.menu button small { font-family: var(--body); font-size: 14px; color: #a9b5d3; font-weight: 400; }
.menu button::before { content: "▶"; position: absolute; left: 14px; color: #f0b64f; opacity: 0; transition: opacity .1s; }
.menu button:hover, .menu button:focus-visible, .menu button.sel { border-color: #f0b64f; background: rgba(240,182,79,.08); outline: none; }
.menu button:hover::before, .menu button:focus-visible::before, .menu button.sel::before { opacity: 1; animation: parpadea 1s steps(2) infinite; }
@keyframes parpadea { 50% { opacity: 0; } }
.pista { text-align: center; font-size: 13px; color: #7f8bab; margin: 0; }
.volver { margin: 18px 0 0; }
.doclista { display: grid; gap: 10px; }
.doclista label { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.doclista input { width: 22px; height: 22px; accent-color: var(--verde); flex: none; margin-top: 2px; }
.doclista small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.doclista input:checked + span > span { text-decoration: line-through; color: var(--muted); }

/* Robot guía */
.guia { display: flex; gap: 14px; align-items: flex-end; margin: 0 0 14px; }
.robot { flex: none; width: 92px; height: 112px; }
.robot .ojo-p { transition: transform .3s ease; }
.robot .parpado { transform-origin: center; transform-box: fill-box; animation: parpadeo 4.2s infinite; }
@keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
.robot .led { animation: led 2.4s ease-in-out infinite; }
@keyframes led { 50% { opacity: .35; } }
.robot .cuerpo-r { transform-origin: 50% 100%; animation: flota 3.2s ease-in-out infinite; }
@keyframes flota { 50% { transform: translateY(-3px); } }
.robot.habla .boca { animation: habla .18s steps(2) infinite; }
@keyframes habla { 50% { transform: scaleY(.3); } }
.robot .boca { transform-origin: center; transform-box: fill-box; }
.robot.feliz .ojo-f { display: block; } .robot .ojo-f { display: none; }
.robot.feliz .ojo-n { display: none; }
.robot.celebra .cuerpo-r { animation: salta .5s cubic-bezier(.3,1.6,.5,1) 3; }
@keyframes salta { 40% { transform: translateY(-14px) rotate(-4deg); } }
.robot.piensa .ojo-p { transform: translate(2px, -3px); }
.robot.piensa .led { animation-duration: .6s; }
.bocadillo { position: relative; background: var(--card); border: 2px solid var(--ink); border-radius: 16px 16px 16px 4px; padding: 12px 16px; font-size: 16px; line-height: 1.45; max-width: 640px; box-shadow: 0 4px 0 var(--line); min-height: 52px; }
.bocadillo b.nombre { display: block; font-family: var(--display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--sello); margin-bottom: 2px; }
.bocadillo::before { content: ""; position: absolute; left: -11px; bottom: 10px; border: 9px solid transparent; border-right-color: var(--ink); border-left: 0; }
.escena .bocadillo { background: #172137; border-color: #f0b64f; color: #eef2fb; box-shadow: none; }
.escena .bocadillo::before { border-right-color: #f0b64f; }
.escena .guia { justify-content: center; }
.hero .guia { margin-top: 20px; }

@media (max-width: 860px) {
  .hero, .jugar, .res-hero { grid-template-columns: 1fr; }
  .stampbig { max-width: 140px; order: -1; justify-self: start; }
  .hero { padding-top: 20px; gap: 12px; }
  .personajes { grid-template-columns: repeat(2, 1fr); }
  .lado { position: static; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .ay .cuerpo { grid-template-columns: 1fr; }
  .mas { grid-template-columns: 1fr; }
  .res-hero svg { width: 110px; height: 110px; }
}
@media (max-width: 420px) {
  .robot { width: 66px; height: 80px; }
  .bocadillo { font-size: 15px; }
  .personajes { grid-template-columns: 1fr; }
  .tablero { padding: 20px; }
  .radar .pill:nth-child(2) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .star, .mas1 { display: none; }
}

<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="home" type="button" aria-label="Volver al inicio">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="var(--sello)" stroke-width="2" stroke-dasharray="3 2.4"/><path d="M13 21l5 5 9-11" fill="none" stroke="var(--sello)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sello a Sello
    </button>
    <div class="radar" aria-live="polite">
      <span class="pill" id="pAyudas"><span class="dot"></span><span id="nAyudas">0</span>&nbsp;ayudas</span>
      <span class="pill oro" id="pEuros"><span class="dot"></span><span id="nEuros">0 €</span>/año</span>
      <span class="pill" id="pPts" title="Puntos"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="var(--oro)"/></svg><span id="nPts">0</span></span>
      <button class="icono" id="mute" type="button" aria-label="Silenciar sonido"></button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* Sello a Sello · Base de conocimiento de ayudas (España)
   Cada ayuda: datos oficiales + función de encaje m(p) con el perfil.
   Revisado: 30/10/2026. Al actualizar, cambia `ver` en la ayuda revisada. */
(function (root) {
  "use strict";

  // ── Indicadores 2026 ──────────────────────────────────────────────
  const IND = {
    anio: 2026,
    IPREM_MES: 600, IPREM_12: 7200, IPREM_14: 8400,   // IPREM congelado desde 2023
    SMI_MES: 1221, SMI_14: 17094,                       // SMI 2026 (14 pagas)
    IMV_BASE: 8803.20,                                  // renta garantizada IMV persona sola / año
    PNC: 8803.20,                                       // pensión no contributiva anual (14 pagas)
    revisado: "2026-10-31"
  };

  // ── Comunidades autónomas ─────────────────────────────────────────
  const CCAA = {
    AN: { n: "Andalucía", web: "https://www.juntadeandalucia.es/", bol: "BOJA", bolUrl: "https://www.juntadeandalucia.es/eboja.html", rmin: "Renta Mínima de Inserción Social en Andalucía" },
    AR: { n: "Aragón", web: "https://www.aragon.es/", bol: "BOA", bolUrl: "https://www.boa.aragon.es/", rmin: "Prestación Aragonesa Complementaria del IMV" },
    AS: { n: "Asturias", web: "https://www.asturias.es/", bol: "BOPA", bolUrl: "https://sede.asturias.es/bopa", rmin: "Salario Social Básico" },
    IB: { n: "Illes Balears", web: "https://www.caib.es/", bol: "BOIB", bolUrl: "https://www.caib.es/eboibfront/", rmin: "Renta Social Garantizada" },
    CN: { n: "Canarias", web: "https://www.gobiernodecanarias.org/", bol: "BOC", bolUrl: "https://www.gobiernodecanarias.org/boc/", rmin: "Renta Canaria de Ciudadanía" },
    CB: { n: "Cantabria", web: "https://www.cantabria.es/", bol: "BOC Cantabria", bolUrl: "https://boc.cantabria.es/", rmin: "Renta Social Básica" },
    CL: { n: "Castilla y León", web: "https://www.jcyl.es/", bol: "BOCYL", bolUrl: "https://bocyl.jcyl.es/", rmin: "Renta Garantizada de Ciudadanía" },
    CM: { n: "Castilla-La Mancha", web: "https://www.castillalamancha.es/", bol: "DOCM", bolUrl: "https://docm.jccm.es/", rmin: "Ingreso Mínimo de Solidaridad" },
    CT: { n: "Cataluña", web: "https://web.gencat.cat/", bol: "DOGC", bolUrl: "https://dogc.gencat.cat/", rmin: "Renda Garantida de Ciutadania" },
    VC: { n: "Comunitat Valenciana", web: "https://www.gva.es/", bol: "DOGV", bolUrl: "https://dogv.gva.es/", rmin: "Renta Valenciana de Inclusión" },
    EX: { n: "Extremadura", web: "https://www.juntaex.es/", bol: "DOE", bolUrl: "https://doe.juntaex.es/", rmin: "Renta Extremeña Garantizada" },
    GA: { n: "Galicia", web: "https://www.xunta.gal/", bol: "DOG", bolUrl: "https://www.xunta.gal/diario-oficial-galicia", rmin: "Renta de Inclusión Social de Galicia (RISGA)" },
    MD: { n: "Comunidad de Madrid", web: "https://www.comunidad.madrid/", bol: "BOCM", bolUrl: "https://www.bocm.es/", rmin: "Renta Mínima de Inserción (RMI)" },
    MC: { n: "Región de Murcia", web: "https://www.carm.es/", bol: "BORM", bolUrl: "https://www.borm.es/", rmin: "Renta Básica de Inserción" },
    NC: { n: "Navarra", web: "https://www.navarra.es/", bol: "BON", bolUrl: "https://bon.navarra.es/", rmin: "Renta Garantizada" },
    PV: { n: "País Vasco", web: "https://www.euskadi.eus/", bol: "BOPV", bolUrl: "https://www.euskadi.eus/bopv", rmin: "Renta de Garantía de Ingresos (RGI, Lanbide)" },
    RI: { n: "La Rioja", web: "https://www.larioja.org/", bol: "BOR", bolUrl: "https://web.larioja.org/bor-portada", rmin: "Ingreso Mínimo de Inserción" },
    CE: { n: "Ceuta", web: "https://www.ceuta.es/", bol: "BOCCE", bolUrl: "https://www.ceuta.es/ceuta/bocce", rmin: "Ingreso Mínimo de Inserción Social (IMIS)" },
    ML: { n: "Melilla", web: "https://www.melilla.es/", bol: "BOME", bolUrl: "https://bomemelilla.es/", rmin: "Ingreso Melillense de Integración (IMI)" }
  };

  // ── Documentos reutilizables ──────────────────────────────────────
  const D = {
    dni: "DNI o NIE en vigor de todas las personas de la unidad de convivencia",
    padron: "Certificado de empadronamiento colectivo (lo da tu ayuntamiento, a menudo online)",
    libro: "Libro de familia o certificados de nacimiento / matrimonio / pareja de hecho",
    renta: "Declaración de la Renta del último año o certificado de imputaciones de la AEAT",
    banco: "Certificado de titularidad de la cuenta bancaria (lo da tu banco)",
    clave: "Cl@ve, certificado digital o DNIe para tramitar online (si no, cita presencial)",
    alquiler: "Contrato de alquiler en vigor y recibos de los últimos meses pagados por banco",
    vida: "Informe de vida laboral (Seguridad Social, descarga inmediata con Cl@ve)",
    discap: "Certificado de grado de discapacidad (si aplica)",
    fn: "Título de familia numerosa o monoparental en vigor (si aplica)",
    nomina: "Nóminas o justificantes de ingresos de los últimos meses",
    estatutos: "Estatutos y acta fundacional de la entidad, inscritos en el registro",
    cif: "Tarjeta de identificación fiscal (NIF) de la entidad",
    junta: "Certificado de la junta directiva vigente y DNI de la persona representante",
    corriente: "Certificados de estar al corriente con Hacienda (AEAT) y con la Seguridad Social",
    proyecto: "Memoria del proyecto con objetivos, actividades, calendario y presupuesto detallado",
    cuentas: "Cuentas anuales o balance y presupuesto del último ejercicio",
    plan: "Plan de empresa o memoria de la actividad (con previsión de ingresos y gastos)",
    altaAEAT: "Alta censal en Hacienda (modelo 036/037)",
    escritura: "Escritura de constitución y estatutos de la sociedad"
  };

  // ── Utilidades de cálculo ─────────────────────────────────────────
  const miembros = p => Math.max(1, (p.adultos || 1) + (p.menores || 0));
  const menores = p => (p.m0_3 || 0) + (p.m3_6 || 0) + (p.m6_18 || 0);
  const esHogar = p => p.tipo === "persona" || p.tipo === "familia";
  const enParo = p => p.laboral === "paro-prestacion" || p.laboral === "paro-sin";
  const trabaja = p => p.laboral === "empleado" || p.laboral === "autonomo";

  // Renta garantizada IMV anual según composición (escala oficial: +30 % por miembro, tope 2,2)
  function rentaIMV(p) {
    const n = miembros(p);
    let esc = Math.min(1 + 0.3 * (n - 1), 2.2);
    let rg = IND.IMV_BASE * esc;
    if (p.monoparental && menores(p) > 0) rg += IND.IMV_BASE * 0.22;
    if (p.discapacidad >= 65) rg += IND.IMV_BASE * 0.22;
    return Math.round(rg);
  }
  function encajaIMV(p) {
    if (!esHogar(p)) return false;
    const edadOk = p.edad >= 23 || (p.edad >= 18 && menores(p) > 0);
    const resOk = p.residencia && p.residencia !== "menos1";
    return edadOk && resOk && p.patrimonioBajo !== false && p.ingresos < rentaIMV(p);
  }
  // Límite bono social eléctrico (CNMC): IPREM 14 pagas × (1,5 +0,3/adulto extra +0,5/menor [+1 especial])
  function limiteBonoSocial(p) {
    let mult = 1.5 + 0.3 * Math.max(0, (p.adultos || 1) - 1) + 0.5 * menores(p);
    if (p.discapacidad >= 33 || p.vg || p.dependencia || (p.monoparental && menores(p) > 0)) mult += 1;
    return Math.round(IND.IPREM_14 * mult);
  }
  // Umbrales becas MEC (orientativos, escala sobre la familia de 4 de la convocatoria 2025-26)
  const ESCALA_BECA = [0, 0.41, 0.67, 0.88, 1, 1.11, 1.21, 1.31, 1.41];
  function umbralBeca(p, ref4) {
    const n = Math.min(miembros(p), 8);
    return Math.round(ref4 * ESCALA_BECA[n]);
  }
  const eur = n => n.toLocaleString("es-ES", { maximumFractionDigits: 0 }) + " €";

  // ── Catálogo de ayudas ────────────────────────────────────────────
  const A = [];
  const add = o => { o.ver = o.ver || IND.revisado; A.push(o); };

  /* ================= PERSONAS Y FAMILIAS ================= */

  add({
    id: "imv", t: "Ingreso Mínimo Vital (IMV)", org: "Seguridad Social (INSS)", amb: "estatal", cat: "ingresos",
    para: ["persona", "familia"],
    res: "Prestación mensual que garantiza un ingreso mínimo a hogares en situación de vulnerabilidad. Se cobra mientras se cumplan los requisitos.",
    cuantia: "Desde 733,60 €/mes (persona sola) hasta 1.613,92 €/mes en 2026, menos los ingresos que ya tenga el hogar. +22 % si es monoparental.",
    plazo: { tipo: "permanente" },
    url: "https://imv.seg-social.es/", fuente: "Seguridad Social · cuantías 2026",
    req: ["Tener 23 años o más (18 si tienes hijos a cargo)", "Residencia legal y efectiva en España al menos 1 año", "Ingresos del año anterior por debajo de la renta garantizada de tu hogar", "Patrimonio (sin vivienda habitual) por debajo del límite legal", "No ser administrador de una sociedad mercantil", "Inscribirte como demandante de empleo si tienes entre 18 y 65 años (salvo excepciones)"],
    docs: [D.dni, D.padron, D.libro, D.renta, D.banco, D.clave],
    pasos: ["Entra en imv.seg-social.es y usa el simulador para comprobar tu cuantía", "Pulsa «Solicitar» (con Cl@ve o sin certificado, con formulario guiado)", "Adjunta los documentos escaneados o fotografiados", "Guarda el justificante con el número de expediente", "La Seguridad Social tiene 6 meses para resolver; consulta el estado en la misma web"],
    m: p => {
      if (!encajaIMV(p)) return null;
      const rg = rentaIMV(p);
      return { n: "alta", why: [`Tus ingresos (${eur(p.ingresos)}) están por debajo de la renta garantizada estimada para tu hogar (${eur(rg)}/año)`], imp: rg - p.ingresos };
    }
  });

  add({
    id: "capi", t: "Complemento de Ayuda para la Infancia (CAPI)", org: "Seguridad Social (INSS)", amb: "estatal", cat: "familia",
    para: ["persona", "familia"],
    res: "Ayuda mensual por cada hijo menor de 18 años para hogares con ingresos bajos o medios-bajos. Se puede cobrar aunque no tengas derecho al IMV.",
    cuantia: "Por hijo y mes en 2026: 115 € (0-3 años), 80,50 € (3-6 años), 57,50 € (6-18 años).",
    plazo: { tipo: "permanente" },
    url: "https://imv.seg-social.es/", fuente: "Seguridad Social · cuantías CAPI 2026",
    req: ["Hijos menores de 18 años en el hogar", "Ingresos del hogar inferiores al 300 % de la renta garantizada del IMV", "Patrimonio neto inferior al 150 % del límite del IMV", "Residencia legal en España"],
    docs: [D.dni, D.padron, D.libro, D.renta, D.banco],
    pasos: ["Solicítalo en imv.seg-social.es marcando solo «Complemento de ayuda para la infancia»", "Si ya cobras el IMV, se reconoce de oficio: comprueba que aparece en tu resolución", "Consulta el estado en la web del IMV"],
    m: p => {
      if (!esHogar(p) || menores(p) === 0) return null;
      const lim = rentaIMV(p) * 3;
      if (p.ingresos >= lim) return null;
      const imp = Math.round(((p.m0_3 || 0) * 115 + (p.m3_6 || 0) * 80.5 + (p.m6_18 || 0) * 57.5) * 12);
      return { n: "alta", why: [`Tienes ${menores(p)} menor(es) y tus ingresos están bajo el límite estimado de ${eur(lim)}`], imp };
    }
  });

  add({
    id: "rmin", t: "Renta mínima de tu comunidad", org: "Servicios sociales de la comunidad autónoma", amb: "autonomico", cat: "ingresos",
    para: ["persona", "familia"],
    res: "Cada comunidad tiene su propia renta de inserción, que complementa o sustituye al IMV y suele ir unida a un itinerario de inserción.",
    cuantia: "Varía por comunidad; se calcula según los miembros del hogar y los ingresos.",
    plazo: { tipo: "permanente", nota: "Solicitud todo el año en servicios sociales" },
    url: c => (CCAA[c] || {}).web, fuente: "Portal oficial de la comunidad",
    req: ["Empadronamiento y residencia en la comunidad (normalmente 1 a 3 años)", "Ingresos por debajo del baremo autonómico", "Haber solicitado antes el IMV, en muchas comunidades"],
    docs: [D.dni, D.padron, D.libro, D.renta, D.banco, "Resolución del IMV (concedido o denegado)"],
    pasos: ["Pide cita en el centro de servicios sociales de tu ayuntamiento", "La trabajadora social revisa tu caso y tramita la solicitud", "Firma el acuerdo o itinerario de inserción si te lo piden"],
    nombre: c => (CCAA[c] || {}).rmin,
    m: p => {
      if (!esHogar(p) || !p.ccaa) return null;
      if (p.ingresos < rentaIMV(p) * 1.05) return { n: encajaIMV(p) ? "media" : "alta", why: ["Tus ingresos son muy bajos para el tamaño de tu hogar"] };
      return null;
    }
  });

  add({
    id: "emergencia", t: "Ayudas de emergencia social del ayuntamiento", org: "Servicios sociales municipales", amb: "local", cat: "ingresos",
    para: ["persona", "familia"],
    res: "Ayudas puntuales para alquiler atrasado, suministros (luz, agua, gas), alimentación, gafas, material escolar o comedor. Las gestiona tu ayuntamiento.",
    cuantia: "Puntual, según necesidad y presupuesto municipal (habitualmente de 100 € a 3.000 €).",
    plazo: { tipo: "permanente", nota: "Todo el año, mientras haya presupuesto municipal" },
    url: "https://administracion.gob.es/", fuente: "Servicios sociales de tu ayuntamiento",
    req: ["Estar empadronado en el municipio", "Situación de necesidad valorada por servicios sociales"],
    docs: [D.dni, D.padron, D.renta, "Facturas o recibos pendientes que justifiquen la necesidad", D.banco],
    pasos: ["Llama o pide cita a los servicios sociales de tu ayuntamiento", "Explica la necesidad concreta y lleva las facturas", "La trabajadora social emite informe y se resuelve en días o semanas"],
    m: p => esHogar(p) && p.ingresos < limiteBonoSocial(p) ? { n: "media", why: ["Tus ingresos te sitúan en el rango de vulnerabilidad que atienden los servicios sociales"] } : null
  });

  add({
    id: "bonoluz", t: "Bono social eléctrico", org: "Ministerio para la Transición Ecológica · CNMC", amb: "estatal", cat: "energia",
    para: ["persona", "familia"],
    res: "Descuento directo en la factura de la luz para hogares vulnerables. Hasta el 31/12/2026 los descuentos excepcionales siguen siendo del 42,5 % (vulnerable) y 57,5 % (vulnerable severo).",
    cuantia: "42,5 % o 57,5 % de descuento en la factura (orientativo: 250-500 € de ahorro al año). Prohibición de cortes de suministro hasta 31/12/2026.",
    plazo: { tipo: "permanente", nota: "Descuentos reforzados hasta 31/12/2026 (RDL 16/2025)" },
    url: "https://www.cnmc.es/facil-para-ti/que-hace-la-cnmc-para-consumidores/bono-social-electrico", fuente: "CNMC · RDL 16/2025",
    req: ["Tener contratada la tarifa regulada (PVPC) con una comercializadora de referencia", "Potencia contratada de 10 kW o menos en tu vivienda habitual", "Renta del hogar ≤ 1,5 × IPREM (12.600 €) +0,3 por adulto extra +0,5 por menor (+1 si hay discapacidad, monoparentalidad, dependencia o violencia de género)", "O bien: familia numerosa, perceptor del IMV o pensionista con pensión mínima"],
    docs: ["Modelo de solicitud de la comercializadora de referencia", D.dni, D.padron, D.libro, D.fn, "Certificado de servicios sociales (discapacidad, VG, dependencia) si aplica"],
    pasos: ["Si no tienes PVPC, cámbiate a una comercializadora de referencia (Energía XXI, Curenergía, Baser, CHC, Régsiti, Teramelcor…)", "Descarga y rellena su modelo de solicitud del bono social", "Envíalo por email, teléfono, correo o en oficina con los documentos", "Respuesta en 10 días hábiles; el descuento aparece en la factura", "Renuévalo cada 2 años (las familias numerosas, cuando caduque el título)"],
    m: p => {
      if (!esHogar(p)) return null;
      const lim = limiteBonoSocial(p);
      const why = [];
      let ok = false;
      if (p.ingresos <= lim) { ok = true; why.push(`Ingresos ${eur(p.ingresos)} ≤ límite ${eur(lim)} para tu hogar` + (p.ingresos <= lim / 2 ? " (posible vulnerable severo: 57,5 %)" : "")); }

        { id: "ambitoEnt", tipo: "chips", txt: "¿Cuál es su ámbito de actuación según estatutos?", op: [{ v: "local", t: "Local o provincial" }, { v: "autonomico", t: "Autonómico" }, { v: "estatal", t: "Estatal" }] }
      ]},
      { t: "Dónde", q: [
        { id: "ccaa", tipo: "ccaa", txt: "¿En qué comunidad tiene su sede?", op: CCAA_OPTS },
        { id: "municipio", tipo: "texto", txt: "¿En qué municipio?", ayuda: "Opcional, para buscar las subvenciones de tu ayuntamiento.", ph: "Ej.: Vigo", opcional: true }
      ]},
      { t: "Situación", q: [
        { g: "Sin inscripción en el registro casi no se puede pedir nada. Si aún no lo estáis, te explico cómo hacerlo.", id: "inscrita", tipo: "chips", txt: "¿Está inscrita en el registro de asociaciones?", op: yesno },
        { id: "antiguedad", tipo: "num", txt: "¿Cuántos años lleva funcionando?", min: 0, max: 100, def: 2 },
        { id: "utilidadPublica", tipo: "chips", txt: "¿Está declarada de utilidad pública?", op: yesno, show: p => p.inscrita },
        { id: "empleados", tipo: "num", txt: "¿Cuántas personas tiene contratadas?", min: 0, max: 500, def: 0 }
      ]},
      { t: "Necesidades", q: [
        { g: "Última pregunta: ¿qué queréis financiar? Marca todo lo que aplique.", id: "necAso", tipo: "multi", txt: "¿Qué queréis financiar o mejorar?", op: [{ v: "proyectos", t: "Proyectos y actividades" }, { v: "personal", t: "Contratar personal" }, { v: "equipamiento", t: "Material y equipamiento" }, { v: "local", t: "Local y energía" }, { v: "voluntariado", t: "Voluntariado" }, { v: "europa", t: "Proyectos europeos" }, { v: "digitalizar", t: "Digitalización" }] }
      ]}
    ]
  };
  const grupo = t => t === "empresa" ? "empresa" : t === "asociacion" ? "asociacion" : "hogar";

  // ── Estado ──
  const NUEVO = () => ({ vista: "inicio", p: {}, nivel: 0, idx: 0, sellos: 0, docs: {}, filtro: "todas", pts: 0, racha: 0, vistos: [] });
  let S = NUEVO();
  try { const g = localStorage.getItem("selloasello"); if (g) S = Object.assign(S, JSON.parse(g)); } catch (e) {}
  const H = window.claude && window.claude.hot;
  if (H && H.data && H.data.S) S = H.data.S;
  if (H && H.snapshot) H.snapshot(() => ({ S }));
  function guardar() { try { localStorage.setItem("selloasello", JSON.stringify(S)); } catch (e) {} }

  function derivar(p) {
    p.menores = (p.m0_3 || 0) + (p.m3_6 || 0) + (p.m6_18 || 0);
    if (p.anioNac) p.edad = ANIO - p.anioNac;
    if (p.tipo === "persona" && !p.adultos) p.adultos = 1;
    return p;
  }
  const niveles = () => NIV[grupo(S.p.tipo)] || [];
  const visibles = n => (niveles()[n] ? niveles()[n].q.filter(q => !q.show || q.show(derivar(S.p))) : []);
  const totalPreg = () => niveles().reduce((s, _, i) => s + visibles(i).length, 0);
  const hechas = () => niveles().reduce((s, _, i) => s + (i < S.nivel ? visibles(i).length : i === S.nivel ? S.idx : 0), 0);

  let ultimoN = -1, ultimoE = -1;
  function radar() {
    const p = derivar(Object.assign({}, S.p));
    const r = p.tipo ? KB.evaluar(p) : [];
    const n = r.filter(x => x.nivel !== "baja").length, e = KB.potencial(r);
    $("#nAyudas").textContent = n;
    $("#nEuros").textContent = eur(e);
    if (n !== ultimoN && ultimoN >= 0) { const el = $("#pAyudas"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    if (e !== ultimoE && ultimoE >= 0) { const el = $("#pEuros"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    ultimoN = n; ultimoE = e;
    if (S.vista === "jugar") {
      S.vistos = S.vistos || [];
      const nuevas = r.filter(x => x.nivel !== "baja" && !S.vistos.includes(x.a.id));
      if (nuevas.length && S.vistos.length + nuevas.length > 0 && radar.listo) {
        S.ultHallada = nuevas[0].nombre || nuevas[0].a.t;
        nuevas.slice(0, 2).forEach(x => aviso(nuevas.length > 1 ? `+${nuevas.length} ayudas desbloqueadas` : "Ayuda desbloqueada", x.nombre || x.a.t));
        SND.moneda();
      }
      nuevas.forEach(x => S.vistos.push(x.a.id));
    }
    radar.listo = true;
    $("#nPts").textContent = (S.pts || 0).toLocaleString("es-ES");
    return r;
  }

  // ── Vistas ──
  function render() {
    guardar();
    document.querySelectorAll(".escena").forEach(e => e.remove());
    if (S.vista === "inicio") vInicio();
    else if (S.vista === "jugar") vJugar();
    else if (S.vista === "analisis") vAnalisis();
    else if (S.vista === "final") vFinal();
    else if (S.vista === "docs") vDocs();
    else if (S.vista === "guia") vGuia();
    else vResultados();
    radar();
  }

  function vInicio() {
    app.innerHTML = `
    <section class="hero">
      <div>
        <h1>Encuentra las ayudas que te tocan, <em>sello a sello</em>.</h1>
        <p class="lead">Responde a unas preguntas como si fuera un juego. Al final tendrás tu expediente: qué ayudas, becas y subvenciones de España encajan contigo, si el plazo está abierto hoy, qué documentos reunir y los pasos para pedirlas.</p>
        <div class="datos"><span>${KB.A.length} ayudas estatales, autonómicas y locales</span><span>Plazos revisados el ${KB.fmt(KB.IND.revisado)}</span><span>Tus respuestas no salen de tu navegador</span></div>
        ${guiaHTML("guiaInicio", "¡Hola! Soy Polito, tu robot guía. Elige abajo tu personaje y te acompaño pregunta a pregunta hasta encontrar tus ayudas. Tardamos unos 3 minutos.", "feliz")}
        ${S.p.tipo ? `<p style="margin-top:18px"><button class="btn pri" id="seguir" type="button">Continuar mi partida</button> <button class="btn link" id="borrar" type="button">Empezar de cero</button></p>` : ""}
      </div>
      <div class="stampbig">${selloSVG("AYUDAS · BECAS · SUBVENCIONES · ", 0)}</div>
    </section>
    <section class="eligir">
      <h2>Elige tu personaje</h2>
      <div class="personajes">
        ${[["persona", "Persona", "Para ti: ingresos, empleo, vivienda, estudios, salud"], ["familia", "Familia", "Hijos, crianza, comedor, deducciones, familia numerosa"], ["asociacion", "Asociación", "ONG, clubes, AMPAs, entidades culturales o vecinales"], ["empresa", "Empresa nueva", "Autónomos, startups, pymes y proyectos de negocio"]]
          .map(([k, t, d]) => `<button class="pj" type="button" data-tipo="${k}">${IC[k]}<b>${t}</b><small>${d}</small></button>`).join("")}
      </div>
    </section>`;
    app.querySelectorAll(".pj").forEach(b => b.onclick = () => {
      S = Object.assign(NUEVO(), { vista: "jugar", p: { tipo: b.dataset.tipo } });
      SND.nivel(); estrellas(b, 16);
      setTimeout(() => window.scrollTo(0, 0), 0);
      if (b.dataset.tipo === "familia") S.p.adultos = 2;
      render();
    });
    const sg = $("#seguir"); if (sg) sg.onclick = () => { S.vista = S.terminado ? "final" : "jugar"; render(); };
    const br = $("#borrar"); if (br) br.onclick = () => { S = NUEVO(); render(); };
  }

  function mapaHTML() {
    const nv = niveles();
    let h = '<nav class="mapa" aria-label="Niveles">';
    nv.forEach((n, i) => {
      const cls = i < S.sellos ? "hecho" : i === S.nivel ? "actual" : "";
      if (i) h += `<span class="tramo ${i <= S.sellos ? "hecho" : ""}"></span>`;
      h += `<button type="button" class="sellito ${cls}" data-n="${i}" title="${esc(n.t)}" aria-label="Nivel ${i + 1}: ${esc(n.t)}" ${i < S.sellos ? "" : "disabled"}>${i < S.sellos ? "✓" : i + 1}</button>`;
    });
    h += `<span class="tramo ${S.sellos >= nv.length ? "hecho" : ""}"></span><span class="sellito ${S.sellos >= nv.length ? "hecho" : ""}" title="Expediente">★</span></nav>`;
    const pct = Math.round(100 * hechas() / Math.max(1, totalPreg()));
    return h + `<div class="xp" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso"><i style="width:${pct}%"></i></div>`;
  }

  function preguntaActual() {
    const vs = visibles(S.nivel);
    if (S.idx >= vs.length) return null;
    return vs[S.idx];
  }

  function vJugar() {
    const nv = niveles();
    if (S.nivel >= nv.length) { S.vista = S.terminado ? "final" : "analisis"; return render(); }
    const q = preguntaActual();
    if (!q) { avanzarNivel(); return; }
    const p = derivar(S.p);
    const nivel = nv[S.nivel];
    const vs = visibles(S.nivel);
    let cuerpo = "";
    const val = q.tipo === "steppers" ? null : p[q.id];

    if (q.tipo === "chips" || q.tipo === "ccaa") {
      cuerpo = `<div class="opciones ${q.tipo === "ccaa" ? "ccaa" : ""}" role="group" aria-label="${esc(q.txt)}">` + q.op.map((o, i) => {
        const sel = S.resp && S.resp[q.id] !== undefined ? S.resp[q.id] === (o.k || String(o.v)) : false;
        return `<button type="button" class="op" data-i="${i}" aria-pressed="${sel}">${q.tipo === "chips" && i < 9 ? `<span class="k">${i + 1}</span>` : ""}<span>${esc(o.t)}${o.d ? `<small>${esc(o.d)}</small>` : ""}</span></button>`;
      }).join("") + "</div>";
    } else if (q.tipo === "multi") {
      const arr = p[q.id] || [];
      cuerpo = `<div class="opciones" role="group">` + q.op.map((o, i) => `<button type="button" class="op" data-i="${i}" aria-pressed="${arr.includes(o.v)}"><span class="k">${i + 1}</span><span>${esc(o.t)}</span></button>`).join("") + "</div>";
    } else if (q.tipo === "num") {
      const v = val != null ? val : q.def;
      cuerpo = `<div class="num"><button type="button" data-d="-1" aria-label="Menos">−</button><input id="in-${q.id}" type="number" inputmode="numeric" min="${q.min}" max="${q.max}" value="${v}" aria-label="${esc(q.txt)}"><button type="button" data-d="1" aria-label="Más">+</button><span class="ayuda" id="suf" style="margin:0">${q.suf ? esc(q.suf(v)) : ""}</span></div>`;
    } else if (q.tipo === "slider") {
      const v = val != null ? val : q.def;
      cuerpo = `<div class="slider"><output id="out" for="in-${q.id}">${eur(v)}${q.mensual ? "/mes" : ""}</output>${q.mensual ? "" : `<span class="mes" id="mes">≈ ${eur(Math.round(v / 12))} al mes · ${eur(Math.round(v / Math.max(1, (p.adultos || 1) + p.menores)))} por persona</span>`}
        <input id="in-${q.id}" type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}" aria-label="${esc(q.txt)}">
        <div class="marcas"><span>${eur(q.min)}</span><span>${eur(q.max / 2)}</span><span>${eur(q.max)}${q.mensual ? "" : " o más"}</span></div></div>`;
    } else if (q.tipo === "steppers") {
      cuerpo = `<div class="steppers">` + q.filas.map(f => `<div class="fila"><span>${esc(f.t)}</span><div class="num"><button type="button" data-f="${f.id}" data-d="-1" aria-label="Menos ${esc(f.t)}">−</button><input id="in-${f.id}" type="number" min="0" max="12" value="${p[f.id] || 0}" aria-label="${esc(f.t)}"><button type="button" data-f="${f.id}" data-d="1" aria-label="Más ${esc(f.t)}">+</button></div></div>`).join("") + "</div>";
    } else if (q.tipo === "texto") {
      cuerpo = `<input class="texto" id="in-${q.id}" type="text" placeholder="${esc(q.ph || "")}" value="${esc(val || "")}" autocomplete="address-level2">`;
    }

    const lista = radar();
    const top = lista.filter(x => x.nivel !== "baja").slice(0, 5);
    app.innerHTML = `${mapaHTML()}
    <section class="jugar">
      <div>
      ${guiaHTML("guia", "")}
      <div class="tablero">
        <div class="eyebrow">Nivel ${S.nivel + 1} · ${esc(nivel.t)} · pregunta ${S.idx + 1} de ${vs.length}${S.racha >= 3 ? `<span class="racha">Racha ×${S.racha}</span>` : ""}</div>
        <h2 id="qtit">${esc(q.txt)}</h2>
        <p class="ayuda">${esc(q.ayuda || (q.tipo === "chips" ? "Pulsa una opción (o su número en el teclado)." : ""))}</p>
        ${cuerpo}
        <div class="acciones">
          <button class="btn link" id="atras" type="button">← Atrás</button>
          <span class="ayuda" style="margin:0;font-size:14px">${Math.round(100 * hechas() / Math.max(1, totalPreg()))} % completado</span>
          <button class="btn pri" id="sig" type="button" ${needsAnswer(q) ? "disabled" : ""}>${S.idx === vs.length - 1 ? "Conseguir sello" : "Siguiente"} →</button>
        </div>
      </div>
      </div>
      <aside class="lado">
        <div class="panel"><h3>Radar de ayudas</h3><div class="bignum">${top.length ? lista.filter(x => x.nivel !== "baja").length : 0}</div><div style="color:var(--muted);font-size:14px">ayudas detectadas hasta ahora</div>
          ${top.length ? `<ul class="mini">${top.map(x => `<li>${esc(x.nombre || x.a.t)}</li>`).join("")}</ul>` : `<p style="font-size:14px;color:var(--muted);margin:10px 0 0">Responde y verás aparecer ayudas aquí.</p>`}</div>
        <div class="panel"><h3>Tu ficha</h3><div class="ficha">${ficha(p)}</div></div>
      </aside>
    </section>`;
    bindPregunta(q);
    const nuevaHallada = S.ultHallada; S.ultHallada = null;
    const pista = q.g || q.ayuda || "Elige la opción que mejor te describa.";
    decir(nuevaHallada ? `¡Mira! Acabo de encontrar «${nuevaHallada}». ${pista}` : (S.idx === 0 && S.nivel > 0 && !q.g ? `¡Nivel ${S.nivel + 1}: ${nivel.t}! ${pista}` : pista), nuevaHallada ? "feliz" : "");
    const h = $("#qtit"); if (h) h.setAttribute("tabindex", "-1");
  }

  function needsAnswer(q) {
    if (q.opcional || q.tipo === "num" || q.tipo === "slider" || q.tipo === "steppers" || q.tipo === "multi") return false;
    return !(S.resp && S.resp[q.id] !== undefined);
  }

  function ficha(p) {
    const f = [];
    const tipoTxt = { persona: "Persona", familia: "Familia", asociacion: "Asociación", empresa: "Empresa nueva" }[p.tipo];
    f.push(`<span>Personaje: <b>${tipoTxt}</b></span>`);
    if (p.edad) f.push(`<span>Edad: <b>${p.edad} años</b></span>`);
    if (p.ccaa) f.push(`<span>Comunidad: <b>${esc(KB.CCAA[p.ccaa].n)}</b>${p.municipio ? " · " + esc(p.municipio) : ""}</span>`);
    if (grupo(p.tipo) === "hogar" && p.adultos) f.push(`<span>Hogar: <b>${p.adultos} adulto(s), ${p.menores} menor(es)</b></span>`);
    if (p.ingresos != null) f.push(`<span>Ingresos: <b>${eur(p.ingresos)}/año</b></span>`);
    if (p.fase) f.push(`<span>Fase: <b>${p.fase}</b> · ${p.forma || ""}</span>`);
    if (p.finalidad) f.push(`<span>Fin: <b>${p.finalidad}</b> · ${p.ambitoEnt || ""}</span>`);
    return f.join("");
  }

  function bindPregunta(q) {
    S.resp = S.resp || {};
    const sig = $("#sig");
    const set = v => { S.p[q.id] = v; radar(); };
    if (q.tipo === "chips" || q.tipo === "ccaa") {
      app.querySelectorAll(".op").forEach(b => b.onclick = () => {
        if (bloqueo) return;
        const o = q.op[+b.dataset.i];
        set(o.v); S.resp[q.id] = o.k || String(o.v);
        estrellas(b); SND.ok(S.racha || 0);
        decir(ANIMOS[Math.floor(Math.random() * ANIMOS.length)], "feliz");
        app.querySelectorAll(".op").forEach(x => x.setAttribute("aria-pressed", x === b));
        sig.disabled = false;
        clearTimeout(bindPregunta.t);
        bindPregunta.t = setTimeout(siguiente, 260);
      });
    } else if (q.tipo === "multi") {
      app.querySelectorAll(".op").forEach(b => b.onclick = () => {
        const o = q.op[+b.dataset.i];
        const arr = (S.p[q.id] || []).slice();
        const k = arr.indexOf(o.v); if (k >= 0) arr.splice(k, 1); else arr.push(o.v);
        set(arr); b.setAttribute("aria-pressed", k < 0);
      });
      if (!S.p[q.id]) S.p[q.id] = [];
    } else if (q.tipo === "num") {
      const inp = $("#in-" + q.id);
      const upd = v => { v = Math.max(q.min, Math.min(q.max, Math.round(+v || 0))); inp.value = v; set(v); if (q.suf) $("#suf").textContent = q.suf(v); };
      if (S.p[q.id] == null) set(q.def);
      inp.oninput = () => { const v = +inp.value; if (v >= q.min && v <= q.max) { set(v); if (q.suf) $("#suf").textContent = q.suf(v); } };
      inp.onchange = () => upd(inp.value);
      app.querySelectorAll(".num button").forEach(b => b.onclick = () => upd(+inp.value + +b.dataset.d));
    } else if (q.tipo === "slider") {
      const inp = $("#in-" + q.id);
      if (S.p[q.id] == null) set(q.def);
      inp.oninput = () => {
        const v = +inp.value; set(v);
        $("#out").textContent = eur(v) + (q.mensual ? "/mes" : "");
        const m = $("#mes"); if (m) m.textContent = `≈ ${eur(Math.round(v / 12))} al mes · ${eur(Math.round(v / Math.max(1, (S.p.adultos || 1) + (S.p.menores || 0))))} por persona`;
      };
    } else if (q.tipo === "steppers") {
      q.filas.forEach(f => { if (S.p[f.id] == null) S.p[f.id] = 0; });
      const upd = (id, v) => { v = Math.max(0, Math.min(12, Math.round(+v || 0))); $("#in-" + id).value = v; S.p[id] = v; derivar(S.p); radar(); };
      app.querySelectorAll(".steppers .num button").forEach(b => b.onclick = () => upd(b.dataset.f, +$("#in-" + b.dataset.f).value + +b.dataset.d));
      q.filas.forEach(f => { $("#in-" + f.id).onchange = e => upd(f.id, e.target.value); });
    } else if (q.tipo === "texto") {
      const inp = $("#in-" + q.id);
      inp.oninput = () => { S.p[q.id] = inp.value.trim(); };
      inp.onkeydown = e => { if (e.key === "Enter") siguiente(); };
    }
    sig.onclick = siguiente;
    $("#atras").onclick = atras;
    app.querySelectorAll(".sellito[data-n]").forEach(b => b.onclick = () => { if (b.disabled) return; S.nivel = +b.dataset.n; S.idx = 0; render(); });
  }

  let bloqueo = false;
  function siguiente() {
    clearTimeout(bindPregunta.t);
    if (bloqueo) return;
    const q = preguntaActual();
    if (q && needsAnswer(q)) return;
    const ahora = Date.now();
    S.racha = ahora - (S.tUlt || 0) < 9000 ? (S.racha || 0) + 1 : 1;
    S.tUlt = ahora;
    const gana = 100 + (S.racha >= 3 ? 25 * Math.min(S.racha, 10) : 0);
    S.pts = (S.pts || 0) + gana;
    const btn = $("#sig");
    flotante(btn, `+${gana}`);
    if (q && q.tipo !== "chips" && q.tipo !== "ccaa") { estrellas(btn); SND.ok(S.racha); }
    SND.pasar();
    S.idx++;
    if (S.idx >= visibles(S.nivel).length) return avanzarNivel();
    render();
    const tb = $(".tablero"); if (tb) tb.classList.add("entra");
    if (window.scrollY > 60) window.scrollTo(0, 0);
    focoTitulo();
  }
  function atras() {
    clearTimeout(bindPregunta.t);
    if (bloqueo) return;
    if (S.idx > 0) S.idx--;
    else if (S.nivel > 0) { S.nivel--; S.idx = Math.max(0, visibles(S.nivel).length - 1); }
    else { S.vista = "inicio"; }
    render();
  }
  function focoTitulo() { const h = $("#qtit"); if (h) h.focus({ preventScroll: true }); }

  function avanzarNivel() {
    const nv = niveles();
    if (bloqueo || !nv[S.nivel]) return;
    bloqueo = true;
    SND.nivel();
    S.pts = (S.pts || 0) + 500;
    const t = nv[S.nivel].t;
    S.sellos = Math.max(S.sellos, S.nivel + 1);
    S.nivel++; S.idx = 0;
    const fin = S.nivel >= nv.length;
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.style.pointerEvents = "auto";
    ov.innerHTML = `<div class="golpe">${selloSVG((fin ? "EXPEDIENTE COMPLETO · " : "NIVEL SUPERADO · ") + t.toUpperCase() + " · ", S.nivel)}<p>${fin ? "¡Expediente completo!" : "¡Sello conseguido!"} +500</p></div>`;
